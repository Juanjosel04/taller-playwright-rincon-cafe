name: Pipeline El Rincón del Café

on:
  push:
    branches: [ 'main', 'develop' ]
  pull_request:
    branches: [ 'main', 'develop' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas-aceptacion:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: '22'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            pruebas/package-lock.json

      - name: Instalar dependencias de la app
        working-directory: app
        run: npm ci

      - name: Instalar dependencias de las pruebas
        working-directory: pruebas
        run: npm ci

      - name: Instalar Chromium
        working-directory: pruebas
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de aceptación
        working-directory: pruebas
        run: npx playwright test --project=chromium --grep @acceptanceTest

      - name: Subir reporte de Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: pruebas/playwright-report
          if-no-files-found: ignore

  desplegar-produccion:
    needs: pruebas-aceptacion
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue
        run: echo "Las pruebas de aceptación pasaron. En este taller el pipeline termina aquí y no se despliega a Render."
